# Render Blueprint — https://render.com/docs/blueprint-spec
# Deploy: New + → Blueprint → select this repo.
# Set env vars in the dashboard (secrets never live here).
services:
  - type: web
    name: portfolio-api
    runtime: docker
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: RUN_BOOTSTRAP
        value: "true"
      - key: ALLOWED_ORIGINS
        value: https://gioudi.github.io
      # Managed providers (Neon) require TLS; never allow silent SQLite fallback in prod.
      - key: POSTGRES_SSL
        value: "true"
      - key: ALLOW_DB_FALLBACK
        value: "false"
      # Seed data for first boot (non-secret).
      - key: DEFAULT_PROJECT_TYPE_1
        value: Web Application
      - key: DEFAULT_PROJECT_TYPE_2
        value: Mobile App
      - key: DEFAULT_PROJECT_TYPE_3
        value: API
      - key: POSTGRES_HOST
        sync: false
      - key: POSTGRES_PORT
        sync: false
      - key: POSTGRES_DB
        sync: false
      - key: POSTGRES_USER
        sync: false
      - key: POSTGRES_PASSWORD
        sync: false
      - key: SECRET_API_KEY
        sync: false
      - key: DEFAULT_USER
        sync: false
      - key: DEFAULT_EMAIL
        sync: false
      - key: DEFAULT_PASSWORD
        sync: false
      - key: CLOUDINARY_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
