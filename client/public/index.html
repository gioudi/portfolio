<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">

    <!-- Restore deep link after GitHub Pages 404.html bounce -->
    <script>
      (function () {
        var r = sessionStorage.getItem("spa-redirect");
        if (!r) return;
        sessionStorage.removeItem("spa-redirect");
        history.replaceState(null, "", r);
      })();
    </script>

    <title>Sergio Penagos — Software Engineer | Portfolio</title>
    <meta name="description" content="Software Engineer specializing in scalable web applications, design systems, and component-driven development. Proficient in JavaScript, React, Vue, TypeScript, and Node.js. Bilingual (EN/ES) with leadership experience.">
    <meta name="keywords" content="software engineer, frontend developer, react, vue, typescript, javascript, node.js, design systems, portfolio, bogota, colombia">
    <meta name="author" content="Sergio Penagos">
    <meta name="robots" content="index, follow">

    <link rel="canonical" href="https://gioudi.github.io/portfolio/">

    <link rel="icon" href="<%= BASE_URL %>favicon.ico">
    <link rel="apple-touch-icon" href="<%= BASE_URL %>img/icons/apple-touch-icon-152x152.png">
    <link rel="manifest" href="<%= BASE_URL %>manifest.json">
    <meta name="theme-color" content="#333333">

    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Sergio Penagos — Software Engineer | Portfolio">
    <meta property="og:description" content="Software Engineer specializing in scalable web applications, design systems, and component-driven development. Bilingual (EN/ES) with leadership experience.">
    <meta property="og:url" content="https://gioudi.github.io/portfolio/">
    <meta property="og:site_name" content="Sergio Penagos — Software Engineer Portfolio">
    <meta property="og:image" content="https://gioudi.github.io/portfolio/img/og-preview.png">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Sergio Penagos — Software Engineer | Portfolio">
    <meta name="twitter:description" content="Software Engineer specializing in scalable web applications, design systems, and component-driven development. Bilingual (EN/ES) with leadership experience.">
    <meta name="twitter:image" content="https://gioudi.github.io/portfolio/img/og-preview.png">

    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": "Sergio Penagos",
      "jobTitle": "Software Engineer",
      "description": "Software Engineer specializing in scalable web applications, design systems, and component-driven development.",
      "url": "https://gioudi.github.io/portfolio/",
      "image": "https://gioudi.github.io/portfolio/img/og-preview.png",
      "sameAs": [
        "https://www.linkedin.com/in/analyst-sergio-penagos/",
        "https://github.com/gioudi"
      ],
      "knowsAbout": [
        "Software Engineering",
        "Frontend Development",
        "React",
        "Vue.js",
        "TypeScript",
        "JavaScript",
        "Node.js",
        "Design Systems",
        "Component-Driven Development",
        "Agile/Scrum",
        "Team Leadership"
      ],
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Bogotá",
        "addressRegion": "Capital District",
        "addressCountry": "CO"
      },
      "nationality": {
        "@type": "Country",
        "name": "Colombia"
      },
      "hasCredential": [
        {
          "@type": "EducationalOccupationalCredential",
          "credentialCategory": "degree",
          "educationalLevel": "Associate Degree",
          "name": "Software Analysis and Development"
        }
      ]
    }
    </script>

    <!-- Preconnect for external CDNs -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>

    <!-- Stylesheets (deferred for performance) -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap" media="print" onload="this.media='all'">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.1/css/all.min.css" media="print" onload="this.media='all'">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/devicons/devicon@v2.15.1/devicon.min.css" media="print" onload="this.media='all'">
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap">
      <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.1/css/all.min.css">
      <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/devicons/devicon@v2.15.1/devicon.min.css">
    </noscript>
  </head>
  <body>
    <noscript>
      <strong>This portfolio requires JavaScript to function. Please enable it to continue.</strong>
    </noscript>
    <div id="app"></div>
  </body>
</html>
