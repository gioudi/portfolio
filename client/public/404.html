<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Sergio Penagos — Portfolio</title>
    <script>
      // GitHub Pages has no server-side routing: this file is served for any
      // unknown path under /portfolio/. Save the deep link, then enter the SPA.
      (function () {
        var target = sessionStorage.getItem("spa-redirect");
        if (!target || target === location.pathname + location.search + location.hash) {
          sessionStorage.setItem(
            "spa-redirect",
            location.pathname + location.search + location.hash
          );
        }
        location.replace("/portfolio/");
      })();
    </script>
  </head>
  <body></body>
</html>
