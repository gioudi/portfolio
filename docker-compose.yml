services:
  api:
    build: ./backend
    container_name: portfolio-api
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      # Local compose DB credentials — dev only, replace via dashboard in production.
      RUN_BOOTSTRAP: "true"
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: portfolio
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: portfolio_dev_pw
      ALLOWED_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
      # Seed user must satisfy the Phase-2b password complexity validator.
      DEFAULT_USER: admin
      DEFAULT_EMAIL: admin@local.dev
      DEFAULT_PASSWORD: Portfolio-dev-2026!
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: portfolio-db
    environment:
      POSTGRES_DB: portfolio
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: portfolio_dev_pw
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio -d portfolio"]
      interval: 5s
      timeout: 3s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: portfolio-pgadmin
    profiles: ["debug"]
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@local.dev
      PGADMIN_DEFAULT_PASSWORD: admin_dev_pw
    ports:
      - "5050:80"
    depends_on:
      - db

volumes:
  pgdata:
